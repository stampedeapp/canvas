name: LDT test built canvas
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run containing patched-canvas-linux-x64-gnu artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Reproduce original failure and check backport with sanitizers
        run: |
          git init /tmp/ldt-brotli
          git -C /tmp/ldt-brotli fetch --depth 1 https://github.com/google/brotli.git 6d03dfbedda1615c4cba1211f8d81735575209c8
          git -C /tmp/ldt-brotli checkout --detach FETCH_HEAD
          if bash scripts/ldt/test-brotli.sh /tmp/ldt-brotli > /tmp/brotli-before.log 2>&1; then
            echo "Expected the unpatched decoder regression to fail" >&2
            exit 1
          fi
          grep -F "tree=0 safe=0: expected BLOCK_SWITCH (-17), got 0" /tmp/brotli-before.log
          bash scripts/ldt/apply-brotli.sh /tmp/ldt-brotli
          BROTLI_TEST_SANITIZERS=1 ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 bash scripts/ldt/test-brotli.sh /tmp/ldt-brotli
      - name: Download already built native package
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name patched-canvas-linux-x64-gnu --dir dist
          mkdir -p dist/package
          tar -xzf dist/napi-rs-canvas-0.1.100-ldt.1.tgz --strip-components=1 -C dist/package
          node -e "const fs=require('fs'),crypto=require('crypto'),p=require('./dist/BUILD-PROVENANCE.json'); if(crypto.createHash('sha256').update(fs.readFileSync('dist/package/skia.linux-x64-gnu.node')).digest('hex')!==p.binarySha256)throw Error('Binary checksum mismatch')"
          cp dist/package/skia.linux-x64-gnu.node dist/package/js-binding.js .
      - name: Package and test native-only dependency override
        run: |
          node scripts/ldt/package-platform.cjs
          node scripts/ldt/test-platform.cjs npm
          npm install --prefix /tmp/ldt-yarn --ignore-scripts @yarnpkg/cli-dist@4.12.0
          LDT_YARN_CLI=/tmp/ldt-yarn/node_modules/@yarnpkg/cli-dist/bin/yarn.js node scripts/ldt/test-platform.cjs yarn
      - name: Install upstream test dependencies
        run: node .yarn/releases/yarn-4.14.1.cjs install --immutable --mode=skip-build
      - name: Download upstream emoji test fixture
        run: curl --fail --location --retry 3 "https://github.com/PoomSmart/EmojiLibrary/releases/download/0.15.4/AppleColorEmoji%402x.ttf" --output __test__/fonts/AppleColorEmoji@2x.ttf
      - name: Compare rendering with original npm release
        run: |
          npm install --prefix /tmp/canvas-original --ignore-scripts @napi-rs/canvas@0.1.100
          node scripts/ldt/render-smoke.cjs /tmp/canvas-original/node_modules/@napi-rs/canvas > dist/render-original.json
          node scripts/ldt/render-smoke.cjs dist/package > dist/render-patched.json
          diff -u dist/render-original.json dist/render-patched.json
          diff -u dist/render-patched.json dist/render-platform-npm.json
          diff -u dist/render-patched.json dist/render-platform-yarn.json
      - name: Upstream rendering regression suites
        run: |
          docker run --rm -v "$PWD:/canvas" -w /canvas node:24.22.1-bookworm \
            node .yarn/releases/yarn-4.14.1.cjs ava -c 1 \
            __test__/global-fonts.spec.ts __test__/draw.spec.ts \
            __test__/image.spec.ts __test__/index.spec.ts __test__/node-canvas-compat.spec.ts \
            __test__/loadimage.spec.ts __test__/variable-fonts.spec.ts \
            __test__/canvas-class.spec.ts __test__/filter.spec.ts __test__/text.spec.ts \
            __test__/to-blob.spec.ts __test__/regression.spec.ts
      - name: Smoke tests under patched Node 22 and Node 24
        run: |
          for version in 22.23.4 24.22.1; do
            docker run --rm --network none -v "$PWD:/canvas:ro" -w /canvas \
              "node:$version-bookworm" node scripts/ldt/render-smoke.cjs dist/package
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canvas-validation-results
          path: |
            dist/*.json
            dist/*.tgz
            __test__/failure/
