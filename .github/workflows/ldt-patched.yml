name: LDT patched canvas
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ldt-patched-canvas-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Sync pinned Skia sources on host
        run: |
          node scripts/ldt/pin-brotli.cjs
          cd skia
          python3 tools/git-sync-deps
      - name: Build all native code from source with patched Brotli
        run: |
          docker run --rm -v "$PWD:/canvas" -w /canvas \
            ghcr.io/brooooooklyn/canvas/ubuntu-builder:jammy@sha256:d007b7070106637445907c434b1e7133c1cb78c606b64958161e2813a80c0a6a \
            bash scripts/ldt/build-linux.sh
      - name: Compare rendering with unmodified npm release
        run: |
          mkdir -p /tmp/canvas-original /tmp/canvas-patched
          npm install --prefix /tmp/canvas-original --ignore-scripts @napi-rs/canvas@0.1.100
          npm install --prefix /tmp/canvas-patched --ignore-scripts "$PWD/dist/napi-rs-canvas-0.1.100-ldt.1.tgz"
          node scripts/ldt/render-smoke.cjs /tmp/canvas-original/node_modules/@napi-rs/canvas > dist/render-original.json
          node scripts/ldt/render-smoke.cjs /tmp/canvas-patched/node_modules/@napi-rs/canvas > dist/render-patched.json
          diff -u dist/render-original.json dist/render-patched.json
      - name: Upstream font, drawing, image, and canvas tests
        run: |
          node .yarn/releases/yarn-4.14.1.cjs ava -c 1 \
            __test__/global-fonts.spec.ts __test__/draw.spec.ts \
            __test__/image.spec.ts __test__/index.spec.ts \
            __test__/node-canvas-compat.spec.ts
      - name: Smoke test in patched Node 22 and Node 24 containers
        run: |
          for version in 22.23.4 24.22.1; do
            docker run --rm --network none -v "$PWD:/canvas:ro" -w /canvas \
              "node:$version-bookworm" node scripts/ldt/render-smoke.cjs dist/package
          done
      - name: Hash release assets
        run: |
          cd dist
          sha256sum *.tgz BUILD-PROVENANCE.json Cargo.lock > SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: patched-canvas-linux-x64-gnu
          path: |
            dist/*.tgz
            dist/*.json
            dist/Cargo.lock
            dist/SHA256SUMS
          if-no-files-found: error
